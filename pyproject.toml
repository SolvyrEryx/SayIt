[project]
name = "sayit"
version = "0.1.1"
description = "Local-first push-to-talk voice typing for your desktop"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # Core dependencies - bundled with installer
    "platformdirs>=4.5.1",
    "pydantic>=2.12.5",
    "pynput>=1.8.1",
    "PySide6-Essentials>=6.6.0",
    "sounddevice>=0.5.3",
    "numpy>=1.26.0",

    "litellm>=1.80.16",
    "pyperclip>=1.9.0",
    "sherpa-onnx @ https://files.pythonhosted.org/packages/fd/2f/1bc6db090dae477db400421ebc419b6e2677750220355a0790a175a58f0c/sherpa_onnx-1.12.21-cp312-cp312-win_amd64.whl ; sys_platform == 'win32' and platform_machine == 'AMD64' and python_version == '3.12'",
    "sherpa-onnx @ https://files.pythonhosted.org/packages/39/f5/d3ddbc62dcfaa93c6beccabfffceec2f586c46cf54d151f64b7469ade4/sherpa_onnx-1.12.21-cp312-cp312-manylinux2014_x86_64.manylinux_2_17_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
    "sherpa-onnx @ https://files.pythonhosted.org/packages/00/ca/bf6d9b07e9b70d96b97d7d630832fca958f0ed47ae60d4fbb549eaaae42f/sherpa_onnx-1.12.21-cp313-cp313-win_amd64.whl ; sys_platform == 'win32' and platform_machine == 'AMD64' and python_version == '3.13'",
    "sherpa-onnx @ https://files.pythonhosted.org/packages/aa/7b/fd834b262c97db6ac03f9fb7c271b4197387cd7be364d8e99513dc18670e/sherpa_onnx-1.12.21-cp313-cp313-manylinux2014_x86_64.manylinux_2_17_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.13'",
    "sherpa-onnx-core==1.12.23",
]



[project.gui-scripts]
sayit = "sayit.app:main"

[project.scripts]
sayit-cli = "sayit.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "black>=25.12.0",
    "briefcase>=0.3.26",
    "isort>=7.0.0",
    "pre-commit>=4.5.1",
    "pyside6>=6.10.1",
    "pytest>=9.0.2",
    "pytest-qt>=4.5.0",
]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

# ============================================================================
# Briefcase Configuration
# ============================================================================
[tool.briefcase]
project_name = "SayIt"
bundle = "com.sayit"
version = "0.1.1"
author = "SayIt"
license.file = "LICENSE"

[tool.briefcase.app.sayit]
formal_name = "SayIt"
icon = "icons/sayit"
description = "SayIt — local push-to-talk voice typing for Windows"
long_description = "SayIt is a lightweight push-to-talk voice-typing utility. Hold a hotkey, speak, release, and the locally-transcribed text is inserted at your cursor. Speech recognition runs on-device via Sherpa-ONNX."
sources = ["src/sayit"]
requires = [
    "platformdirs>=4.5.1",
    "pydantic>=2.12.5",
    "pynput>=1.8.1",
    "PySide6-Essentials>=6.6.0",
    "sounddevice>=0.5.3",
    "numpy>=1.26.0",
    "sherpa-onnx @ https://files.pythonhosted.org/packages/fd/2f/1bc6db090dae477db400421ebc419b6e2677750220355a0790a175a58f0c/sherpa_onnx-1.12.21-cp312-cp312-win_amd64.whl ; sys_platform == 'win32' and platform_machine == 'AMD64' and python_version == '3.12'",
    "sherpa-onnx @ https://files.pythonhosted.org/packages/39/f5/d3ddbc62dcfaa93c6beccabfffceec2f586c46cf54d151f64b7469ade4/sherpa_onnx-1.12.21-cp312-cp312-manylinux2014_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.12'",
    "sherpa-onnx @ https://files.pythonhosted.org/packages/00/ca/bf6d0809e7b07d96b97d7d630832fca958f0ed47ae60d4fbb549eaaae42f/sherpa_onnx-1.12.21-cp313-cp313-win_amd64.whl ; sys_platform == 'win32' and platform_machine == 'AMD64' and python_version == '3.13'",
    "sherpa-onnx @ https://files.pythonhosted.org/packages/aa/7b/fd834b262c97db6ac03f9fb7c271b4197387cd7be364d8e99513dc18670e/sherpa_onnx-1.12.21-cp313-cp313-manylinux2014_x86_64.whl ; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.13'",
    # Keep the native ASR core validated with sherpa-onnx 1.12.21.
    "sherpa-onnx-core==1.12.23",
    "litellm>=1.80.16",
    "pyperclip>=1.9.0",
]

[tool.briefcase.app.sayit.linux.appimage]
manylinux = "manylinux_2_28"
