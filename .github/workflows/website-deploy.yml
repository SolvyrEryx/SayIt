name: Deploy Website

# Deploys the static site to GitHub Pages. The release manifest is fetched
# from the latest published release; if no published release or manifest
# exists, the site deploys with an honest fallback instead of fabricated data.

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment in progress; the last successful deploy wins.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Website deployments always come from the current main branch.
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build site
        working-directory: website
        env:
          # Project sites are served from https://<owner>.github.io/<repo>/
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_ORIGIN: https://${{ github.repository_owner }}.github.io
        run: npm run build

      - name: Fetch release manifest
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -uo pipefail
          TAG="$EVENT_TAG"
          if [ -z "$TAG" ]; then
            TAG="$(gh api "repos/$REPO/releases/latest" --jq '.tag_name' 2>/dev/null || true)"
          fi
          if [ -z "$TAG" ]; then
            echo "No published release yet — deploying without a manifest (honest fallback)."
            exit 0
          fi
          ASSET_ID="$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[] | select(.name == "release-manifest.json") | .id' 2>/dev/null || true)"
          if [ -z "$ASSET_ID" ]; then
            echo "Release $TAG has no release-manifest.json asset — deploying without a manifest."
            exit 0
          fi
          gh api "repos/$REPO/releases/assets/$ASSET_ID" \
            -H "Accept: application/octet-stream" \
            > website/out/release-manifest.json
          echo "Embedded release manifest for $TAG:"
          cat website/out/release-manifest.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
